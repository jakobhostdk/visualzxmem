server {
  listen 80 default_server;
  listen [::]:80 default_server;
  root /usr/share/nginx/html;

  # Don't let the browser cache the HTML — development iteration.
  location ~* \.(html|rom)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
